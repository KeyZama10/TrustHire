# python -m trusthire.video.train [key=value ...]
stage: frame              # frame | temporal
backbone: effnb4          # effnb4 | xception | any timm id, e.g. convnextv2_tiny.fcmae_ft_in22k_in1k,
                          #   vit_small_patch14_dinov2.lvd142m, eva02_small_patch14_336.mim_in22k_ft_in1k
init_from_dfb: true       # start effnb4/xception from the DeepfakeBench FF++ checkpoint
img_size: 224             # timm backbones (effnb4/xception use 256)
temporal: transformer     # bilstm | transformer
temporal_len: 16
temporal_epochs: 30
frame_weights: null       # for stage=temporal with a timm backbone
epochs: 10
batch_size: 32
lr: 2.0e-4
weight_decay: 0.05
label_smoothing: 0.05
workers: 4
compile: false            # torch.compile (Linux + CUDA recommended)
seed: 1024
tracking: mlflow          # mlflow | csv
data:
  crops: ???              # crops.csv from `python -m trusthire.video.prepare crops`
  train_datasets: [ffpp]
  balance_ratio: 1
hydra:
  run:
    dir: logs/hydra/video/${now:%Y-%m-%d_%H-%M-%S}
