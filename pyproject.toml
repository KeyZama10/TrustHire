[project]
name = "trusthire"
version = "0.1.0"
description = "TrustHire: multimodal AI fake-interview detection (deepfake video, voice spoofing, AV sync, identity continuity, behaviour, scripted answers, fusion, explainability)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0 (code); see docs/MODEL_CARDS.md for third-party model licenses" }
dependencies = [
    # core numerics / media
    "numpy>=2.2",
    "scipy>=1.15",
    "opencv-python-headless>=4.11",
    "av>=14",
    "soundfile>=0.13",
    "librosa>=0.11",
    "praat-parselmouth>=0.4.5",
    "pandas>=2.2",
    "matplotlib>=3.10",
    # deep learning
    "torch>=2.7",
    "torchvision>=0.22",
    "timm>=1.0.15",
    "transformers>=4.55",
    "huggingface-hub>=0.34",
    "safetensors>=0.5",
    "onnx>=1.18",
    "onnxruntime>=1.22",
    "onnxscript>=0.3",
    "lightning>=2.5",
    "hydra-core>=1.3.2",
    # modality-specific
    "mediapipe>=0.10.21",
    "ultralytics>=8.3.200",
    "faster-whisper>=1.1",
    "speechbrain>=1.0.3",
    "sentence-transformers>=5.0",
    "faiss-cpu>=1.11",
    "pypdf>=5.4",
    # fusion / explainability
    "scikit-learn>=1.7",
    "lightgbm>=4.6",
    "xgboost>=3.0",
    "shap>=0.48",
    "grad-cam>=1.5.5",
    "reportlab>=4.4",
    "anthropic>=0.60",
    # serving
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "aiortc>=1.13",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "python-multipart>=0.0.20",
    "celery[redis]>=5.5",
    "redis>=6.2",
    "httpx>=0.28",
    "websockets>=15",
    "efficientnet-pytorch>=0.7.1",
    "python-speech-features>=0.6",
]

[project.optional-dependencies]
track = ["mlflow>=3.1"]

[project.scripts]
trusthire = "trusthire.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.12",
    "mypy>=1.17",
    "pre-commit>=4.2",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'win32' or sys_platform == 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'win32' or sys_platform == 'darwin'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trusthire"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
packages = ["trusthire"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["trusthire.*.train", "trusthire.*.export"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "models: needs downloaded pretrained weights (run `trusthire download-models`)",
    "slow: slow test",
]
